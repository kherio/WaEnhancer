name: Release

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Get version and SHA
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE=$(sed -n 's/^val baseVersion = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          LATEST=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null | cut -d- -f1 || true)
          VERSION=$BASE
          if [ -n "$LATEST" ]; then
            NEXT="${LATEST%.*}.$(( ${LATEST##*.} + 1 ))"
            # Se usa la mayor entre la versión base del código y la siguiente a la última release
            VERSION=$(printf '%s\n%s\n' "$BASE" "$NEXT" | sort -V | tail -n 1)
          fi
          SHA8=$(git rev-parse --short=8 HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION-$SHA8" >> $GITHUB_OUTPUT

      - name: Write key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          if [ ! -z "$KEY_STORE" ]; then
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
          echo androidStoreFile='key.jks' >> gradle.properties
          echo "$KEY_STORE" | base64 --decode > key.jks
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all variants
        run: ./gradlew assembleWhatsappDebug assembleBusinessDebug -Pminify=true -PappVersion=${{ steps.vars.outputs.version }}

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: WaToolkit ${{ steps.vars.outputs.version }}
          body_path: changelog.txt
          files: |
            app/build/outputs/apk/whatsapp/debug/WaToolkit*.apk
            app/build/outputs/apk/business/debug/WaToolkit-Business*.apk
          tag_name: ${{ steps.vars.outputs.tag }}
