name: Build WhatsApp

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Write key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          if [ ! -z "$KEY_STORE" ]; then
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
          echo androidStoreFile='key.jks' >> gradle.properties
          echo "$KEY_STORE" | base64 --decode > key.jks
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testWhatsappDebugUnitTest 2>&1 | tee build.log

      - name: Build WhatsApp Release
        run: |
          set -o pipefail
          ./gradlew assembleWhatsappDebug -Pminify=true 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|AssertionError|Exception" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: WaToolkit
          path: app/build/outputs/apk/whatsapp/debug/WaToolkit*.apk
