name: Watch WhatsApp

# Opens an issue when a new WhatsApp version is released, so you can check
# that the module still supports it. It does not download or modify anything.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  watch:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Find the latest WhatsApp version
        id: wa
        run: |
          FEED=$(curl -fsSL -A "Mozilla/5.0" "https://www.apkmirror.com/apk/whatsapp-inc/whatsapp/feed/" || true)
          VER=$(printf '%s' "$FEED" | grep -o -E 'WhatsApp Messenger [0-9]+(\.[0-9]+){3}' | head -n 1 | grep -o -E '[0-9]+(\.[0-9]+){3}' || true)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Latest version detected: ${VER:-none}"

      - name: Open an issue if it is a new version
        if: steps.wa.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.wa.outputs.version }}
        run: |
          TITLE="New WhatsApp version: $VER"
          EXISTS=$(gh issue list --repo "${{ github.repository }}" --state all --search "\"$TITLE\" in:title" --json title --jq 'length')
          if [ "$EXISTS" = "0" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" \
              --body "WhatsApp $VER has been released. Check that the module features still work with it and, if something fails, attach the LSPosed/Vector log."
          fi
